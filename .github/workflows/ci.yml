name: Validate Chef's Shelf
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: npm ci --no-audit --no-fund
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - run: npm run test:rules
      - run: flutter build web --release --dart-define=USE_FIREBASE_EMULATORS=true --no-web-resources-cdn
      - name: Browser integration with real Auth, Firestore and TheMealDB
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          CHEFS_SCREENSHOT_DIR: coverage/screenshots
        run: npx firebase emulators:exec --only auth,firestore --project demo-chefs-shelf 'bash scripts/check_web.sh'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-and-logs
          path: |
            coverage/lcov.info
            coverage/screenshots/
            *-debug.log
